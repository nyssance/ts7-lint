# Formatting and linting are built into Bun (1.4.4+); only non-default settings are written.
[fmt]
printWidth = 120
semi = false
trailingComma = "none"
sortImports = true
ignorePatterns = [
  "bun.lock",
  "**/*.md",
  "package.json",
  "**/*.toml",
]

[lint]
typeAware = true
ignorePatterns = [
  "**/node_modules/**",
]
